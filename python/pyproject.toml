[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsua-csb"
version = "0.1.0"
description = "Global Sensitivity and Uncertainty Analysis - Confidence Subcontour Box: sensitivity analysis, uncertainty analysis, parameter estimation, and practical identifiability analysis for symbolic-ODE and user-defined models. Python port of the MATLAB GSUA-CSB toolbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Carlos Mario Velez" },
    { name = "Daniel Rojas Diaz", email = "drojasd@eafit.edu.co" },
]
keywords = [
    "sensitivity-analysis",
    "uncertainty-analysis",
    "parameter-estimation",
    "identifiability",
    "system-identification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
all = ["gsua-csb[symbolic]"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/drojasd/GSUA-CSB"
Documentation = "https://drojasd.github.io/GSUA-CSB/gsua_userguide"
"MATLAB toolbox (this package's origin)" = "https://github.com/drojasd/GSUA-CSB/tree/master"

[tool.hatch.build.targets.wheel]
packages = ["src/gsua_csb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
